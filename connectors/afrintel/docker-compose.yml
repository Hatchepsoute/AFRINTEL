services:
  connector-afrintel:
    build: .
    environment:
      OPENCTI_URL: ${OPENCTI_URL:-http://opencti:8080}
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_AFRINTEL_ID:?Set a unique UUIDv4}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: AFRINTEL
      CONNECTOR_SCOPE: identity,threat-actor,incident,relationship,report
      CONNECTOR_CONFIDENCE_LEVEL: 50
      CONNECTOR_UPDATE_EXISTING_DATA: "true"
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P1D
      AFRINTEL_SOURCE: ${AFRINTEL_SOURCE:-github}
      AFRINTEL_GITHUB_REPO: ${AFRINTEL_GITHUB_REPO:-Hatchepsoute/AFRINTEL}
      AFRINTEL_GITHUB_BRANCH: ${AFRINTEL_GITHUB_BRANCH:-main}
      AFRINTEL_GITHUB_TOKEN: ${AFRINTEL_GITHUB_TOKEN:-}
      AFRINTEL_REPO_PATH: ${AFRINTEL_REPO_PATH:-/repo}
    restart: unless-stopped
    networks: [opencti]
networks:
  opencti:
    external: true
    name: ${OPENCTI_NETWORK:-opencti-docker_default}
